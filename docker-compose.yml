services:

  # -------------------------------------------------------------------------
  # Message broker
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # -------------------------------------------------------------------------
  # Time-series database
  # -------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=p1data
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - influxdb_data:/var/lib/influxdb

  # -------------------------------------------------------------------------
  # Dashboard
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  # -------------------------------------------------------------------------
  # P1 serial publisher (reads from smart meter, pushes to RabbitMQ)
  # -------------------------------------------------------------------------
  p1publisher:
    build: ./p1serial_docker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - SERIAL_BAUD=115200
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=p1data

  # -------------------------------------------------------------------------
  # P1 consumer (reads from RabbitMQ, writes to InfluxDB)
  # -------------------------------------------------------------------------
  p1consumer:
    build: ./p1serial_docker
    command: ["python", "-u", "p1consumer.py"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=p1data
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USER=admin
      - INFLUXDB_PASS=admin
      - INFLUXDB_DB=p1data

volumes:
  rabbitmq_data:
  influxdb_data:
  grafana_data:
